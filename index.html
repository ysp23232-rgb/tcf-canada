<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b4d47">
  <title>TCF Canada — Offline Practice</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="learning.css?v=1.3.0">
  <link rel="stylesheet" href="study-suite-v8.css?v=8.0.1">
  <link rel="stylesheet" href="ui-rescue-v9.css?v=9.1.0">
</head>
<body>
  <div id="app"></div>
  <script src="data.js"></script>
  <script src="resources-data.js"></script>
  <script src="writing-guides.js"></script>
  <script src="speaking-guides.js"></script>
  <script src="master-guides.js?v=1.0.0"></script>
  <script src="app-v7.js?v=10.4.0"></script>
  <script src="study-suite-v8.js?v=8.0.1"></script>
  <script src="ui-rescue-v9.js?v=9.1.0"></script>
  <!-- INDEX-ONLY: show the original Reading explanation in Attempt Review. -->
  <script>
  (function () {
    'use strict';
    function normalize(s) {
      return String(s || '').replace(/\u00a0/g, ' ').replace(/\s+/g, ' ').trim();
    }
    function stripExplanationPrefix(s) {
      return String(s || '').replace(/^\s*(?:Explanation|Explication)\s*:\s*/i, '').trim();
    }
    function escapeHtml(s) {
      return String(s || '').replace(/[&<>"']/g, function (c) {
        return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
      });
    }
    function findReadingQuestion(prompt, passage) {
      var exams = Array.isArray(window.TCF_EXAMS) ? window.TCF_EXAMS : [];
      var p = normalize(prompt);
      var c = normalize(passage);
      for (var i = 0; i < exams.length; i++) {
        var exam = exams[i];
        if (!exam || exam.type !== 'reading' || !Array.isArray(exam.questions)) continue;
        for (var j = 0; j < exam.questions.length; j++) {
          var q = exam.questions[j];
          if (!q) continue;
          if (normalize(q.prompt) !== p) continue;
          if (c && normalize(q.content) !== c) continue;
          return q;
        }
      }
      return null;
    }
    function addOriginalExplanation(root) {
      if (!root) return;
      var promptEl = root.querySelector('.question-title');
      var passageEl = root.querySelector('.reading-evidence-content');
      var prompt = promptEl ? (promptEl.textContent || '') : '';
      var passage = passageEl ? (passageEl.textContent || '') : '';
      var key = normalize(prompt) + '||' + normalize(passage);
      var oldKey = root.getAttribute('data-original-reading-explanation-key') || '';
      var existing = root.querySelector('.original-reading-explanation');

      // [data-review] is reused for Q1, Q2, Q3... so the question key must be refreshed.
      if (!promptEl || !passageEl) {
        if (existing) existing.remove();
        root.removeAttribute('data-original-reading-explanation-key');
        return;
      }
      if (oldKey === key && existing) return;
      if (existing) existing.remove();

      var q = findReadingQuestion(prompt, passage);
      if (!q || !q.explanation) {
        root.setAttribute('data-original-reading-explanation-key', key);
        return;
      }
      var explanation = stripExplanationPrefix(q.explanation);
      if (!explanation) {
        root.setAttribute('data-original-reading-explanation-key', key);
        return;
      }

      var box = document.createElement('div');
      box.className = 'explain original-reading-explanation';
      box.style.marginTop = '14px';
      box.innerHTML = '<b>Explanation:</b><br>' + escapeHtml(explanation);

      var options = root.querySelector('.options');
      if (options) options.insertAdjacentElement('afterend', box);
      else {
        var actions = root.querySelector('.actions');
        if (actions) root.insertBefore(box, actions);
        else root.appendChild(box);
      }
      root.setAttribute('data-original-reading-explanation-key', key);
    }
    function scan() {
      document.querySelectorAll('[data-review]').forEach(addOriginalExplanation);
    }
    var observer = new MutationObserver(scan);
    observer.observe(document.documentElement, { childList: true, subtree: true });
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', scan, { once: true });
    } else {
      scan();
    }
  })();
  </script>
</body>
</html>
